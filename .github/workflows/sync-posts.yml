name: Sync Posts & Manage Cache

# 当文章目录有变动或推送时触发，或通过 Pages CMS / 手动触发
on:
  push:
    branches:
      - main
    paths:
      - 'posts/**'
      - 'friends.json'
      - 'blog.config.json'
      - 'about.md'
  workflow_dispatch:
    inputs:
      action_type:
        description: '选择操作类型 (all: 全部执行, kv: 清除 KV 缓存并重新拉取, cdn: 清除 CDN 缓存)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - kv
          - cdn
      payload:
        description: 'Pages CMS 上下文 Payload'
        required: false
        type: string

concurrency:
  group: sync-posts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-posts:
    runs-on: ubuntu-latest
    name: Sync Posts & Manage Cache
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 解析 Pages CMS 传入的上下文 Payload 与字段输入
      - name: Parse inputs and Pages CMS payload
        run: |
          node -e '
            const fs = require("fs");
            let actionType = process.env.INPUT_ACTION_TYPE;
            if (process.env.GITHUB_EVENT_NAME === "push") {
              actionType = "all";
            }
            if (process.env.INPUT_PAYLOAD) {
              try {
                const payload = JSON.parse(process.env.INPUT_PAYLOAD);
                if (payload?.inputs?.action_type) {
                  actionType = payload.inputs.action_type;
                }
              } catch (e) {
                console.warn("Could not parse Pages CMS payload:", e.message);
              }
            }
            if (!actionType) actionType = "all";
            console.log("Selected action type:", actionType);
            fs.appendFileSync(process.env.GITHUB_ENV, `ACTION_TYPE=${actionType}\n`);
          '
        env:
          INPUT_ACTION_TYPE: ${{ github.event.inputs.action_type }}
          INPUT_PAYLOAD: ${{ github.event.inputs.payload }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      # ----------------------------------------------------
      # 1. 文章清单更新与后端 KV / 内存缓存刷新 (action_type: kv 或 all)
      # ----------------------------------------------------
      - name: Update post manifest
        if: ${{ env.ACTION_TYPE == 'kv' || env.ACTION_TYPE == 'all' }}
        run: node scripts/gen-manifest.mjs

      - name: Commit & push manifest if updated
        if: ${{ env.ACTION_TYPE == 'kv' || env.ACTION_TYPE == 'all' }}
        run: |
          if ! git diff --quiet posts/manifest.json; then
            echo "检测到 manifest.json 发生变动，自动提交最新文章清单..."
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add posts/manifest.json
            git commit -m "chore: auto-update posts/manifest.json [skip ci]"
            git push
          else
            echo "manifest.json 已是最新，无需提交。"
          fi

      - name: Notify Blog Backend to purge KV and re-cache
        if: ${{ env.ACTION_TYPE == 'kv' || env.ACTION_TYPE == 'all' }}
        run: |
          BLOG_URL="${{ vars.BLOG_URL || secrets.BLOG_URL }}"
          PURGE_SECRET="${{ secrets.PURGE_SECRET || secrets.GH_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}"

          if [ -z "$BLOG_URL" ]; then
            echo "⚠️ 未配置 BLOG_URL，跳过博客后端缓存刷新通知。"
            echo "提示：请在 GitHub 仓库 Settings -> Secrets and variables -> Actions 中设置变量 BLOG_URL (如: https://blog.example.com)"
            exit 0
          fi

          echo "正在通知博客后端重新加载文章与友链缓存: ${BLOG_URL%/}/api/posts/purge"
          HTTP_CODE=$(curl -s -o /tmp/purge_res.json -w "%{http_code}" -X POST "${BLOG_URL%/}/api/posts/purge" \
            -H "X-Purge-Secret: ${PURGE_SECRET}")

          echo "HTTP 状态码: $HTTP_CODE"
          if [ -f /tmp/purge_res.json ]; then
            echo "响应内容: $(cat /tmp/purge_res.json)"
          fi

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ 博客后端已成功清空旧数据缓存并重新缓存最新清单与友链！"
          else
            echo "::warning::博客后端缓存刷新请求返回非 2xx 状态码: $HTTP_CODE (请核对 PURGE_SECRET 与服务端状态)"
          fi

      # ----------------------------------------------------
      # 2. 全球 CDN 边缘节点缓存强制清空 (action_type: cdn 或 all)
      # ----------------------------------------------------
      - name: Force Purge Cloudflare CDN Cache
        if: ${{ env.ACTION_TYPE == 'cdn' || env.ACTION_TYPE == 'all' }}
        run: |
          CF_ZONE_ID="${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}"
          CF_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          BLOG_URL="${{ vars.BLOG_URL || secrets.BLOG_URL }}"
          ACTION_TYPE="${{ env.ACTION_TYPE }}"

          # 自动清理首尾空格与可能误粘的 Bearer 前缀
          CF_ZONE_ID=$(echo "$CF_ZONE_ID" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          CF_TOKEN=$(echo "$CF_TOKEN" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^Bearer[[:space:]]\+//I')

          if [ -z "$CF_TOKEN" ]; then
            echo "ℹ️ 未配置 CLOUDFLARE_API_TOKEN，跳过 Cloudflare CDN 清理。"
            exit 0
          fi

          # 若未显式配置 CF_ZONE_ID，自动通过 Cloudflare API 检索并匹配 Zone ID
          if [ -z "$CF_ZONE_ID" ]; then
            echo "🔍 未显式配置 CLOUDFLARE_ZONE_ID，正在尝试通过 API 自动检索与匹配..."
            AUTO_ZONE_ID=$(CF_TOKEN="$CF_TOKEN" BLOG_URL="$BLOG_URL" node -e '
              async function run() {
                const token = process.env.CF_TOKEN;
                const blogUrl = process.env.BLOG_URL;
                let targetHost = "";
                if (blogUrl) {
                  try {
                    const u = new URL(blogUrl.startsWith("http") ? blogUrl : "https://" + blogUrl);
                    targetHost = u.hostname.toLowerCase();
                  } catch {}
                }
                try {
                  const res = await fetch("https://api.cloudflare.com/client/v4/zones?per_page=50", {
                    headers: {
                      Authorization: "Bearer " + token,
                      "Content-Type": "application/json"
                    }
                  });
                  if (!res.ok) process.exit(1);
                  const data = await res.json();
                  const zones = data?.result || [];
                  if (zones.length === 0) process.exit(1);

                  if (targetHost) {
                    const matched = zones.find(z => targetHost === z.name.toLowerCase() || targetHost.endsWith("." + z.name.toLowerCase()));
                    if (matched) {
                      console.log(matched.id);
                      process.exit(0);
                    }
                  }

                  if (zones.length === 1) {
                    console.log(zones[0].id);
                    process.exit(0);
                  }
                } catch {
                  process.exit(1);
                }
                process.exit(1);
              }
              run();
            ' 2>/dev/null || true)

            if [ -n "$AUTO_ZONE_ID" ]; then
              CF_ZONE_ID="$AUTO_ZONE_ID"
              echo "✓ 自动发现并解析到 Cloudflare Zone ID: ${CF_ZONE_ID}"
              gh variable set CLOUDFLARE_ZONE_ID --body "$CF_ZONE_ID" 2>/dev/null || true
            else
              echo "::warning::自动解析 Zone ID 失败（可能未配置 BLOG_URL，或 Token 未包含【Zone -> Zone -> Read】权限）。"
              echo "💡 提示：请在 GitHub Secrets/Variables 中手动配置 CLOUDFLARE_ZONE_ID，或为 Token 追加【Zone -> Zone -> Read】权限。"
              exit 0
            fi
          fi

          # 构建清理 Payload：手动选 cdn 执行全量清空；常规更新执行精准 URL 清除（保护 /images/* 等长效缓存）
          PAYLOAD='{"purge_everything":true}'
          if [ "$ACTION_TYPE" != "cdn" ] && [ -n "$BLOG_URL" ]; then
            TARGET_ORIGIN="${BLOG_URL%/}"
            if [[ ! "$TARGET_ORIGIN" =~ ^https?:// ]]; then
              TARGET_ORIGIN="https://${TARGET_ORIGIN}"
            fi

            FILES_JSON=$(TARGET_ORIGIN="$TARGET_ORIGIN" node -e '
              const fs = require("fs");
              const origin = process.env.TARGET_ORIGIN;
              const urls = [
                origin + "/",
                origin + "/archive",
                origin + "/links",
                origin + "/about",
                origin + "/sitemap.xml",
                origin + "/rss.xml",
                origin + "/atom.xml"
              ];
              if (fs.existsSync("posts/manifest.json")) {
                try {
                  const manifest = JSON.parse(fs.readFileSync("posts/manifest.json", "utf-8"));
                  const posts = Array.isArray(manifest) ? manifest : (manifest.posts || []);
                  posts.slice(0, 10).forEach(p => {
                    if (p.slug) urls.push(origin + "/posts/" + encodeURIComponent(p.slug));
                  });
                } catch {}
              }
              // Cloudflare API 单次 files 上限为 30 个 URL
              console.log(JSON.stringify({ files: urls.slice(0, 30) }));
            ' 2>/dev/null || true)

            if [ -n "$FILES_JSON" ]; then
              PAYLOAD="$FILES_JSON"
              echo "🎯 本次采用受影响 URL 精准清除（保护 /images/* 静态图片长效缓存，共清理 $(echo "$FILES_JSON" | grep -o 'http' | wc -l) 个核心页面）"
            fi
          else
            echo "🧹 本次采用全量清空 (purge_everything: true)"
          fi

          echo "正在请求 Cloudflare Control Plane 广播清除全球 CDN 边缘节点缓存 (Zone: ${CF_ZONE_ID})..."
          HTTP_CODE=$(curl -s -o /tmp/cf_purge.json -w "%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD")

          echo "Cloudflare Purge HTTP 状态码: $HTTP_CODE"
          if [ -f /tmp/cf_purge.json ]; then
            echo "Cloudflare 响应内容: $(cat /tmp/cf_purge.json)"
          fi

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Cloudflare 全球 300+ 机房 CDN 缓存已成功清理！"
          else
            echo "::warning::Cloudflare CDN 清除未返回 2xx (HTTP $HTTP_CODE)"
            if [ "$HTTP_CODE" -eq 401 ]; then
              echo "💡 提示 401 Authentication error 常见原因排查："
              echo "   1. CLOUDFLARE_ZONE_ID 是否误填为 Account ID？(请进入具体域名 kyuphoenix.com 页面右下角获取【区域 ID / Zone ID】)"
              echo "   2. CLOUDFLARE_API_TOKEN 是否包含【区域 (Zone) -> 缓存清除 (Cache Purge) -> 清除 (Purge)】权限？"
              echo "   3. Token 的 Zone 范围是否包含该域名？是否误设了 Client IP 筛选限制？"
            fi
          fi

      - name: Force Purge Netlify CDN Cache
        if: ${{ env.ACTION_TYPE == 'cdn' || env.ACTION_TYPE == 'all' }}
        run: |
          NETLIFY_SITE_ID="${{ secrets.NETLIFY_SITE_ID || vars.NETLIFY_SITE_ID || secrets.NETLIFY_PROJECT_ID || vars.NETLIFY_PROJECT_ID }}"
          NETLIFY_TOKEN="${{ secrets.NETLIFY_API_KEY || secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN }}"

          if [ -z "$NETLIFY_SITE_ID" ] || [ -z "$NETLIFY_TOKEN" ]; then
            echo "ℹ️ 未配置 NETLIFY_SITE_ID (Project ID) 或 NETLIFY_API_KEY，跳过 Netlify CDN 清理。"
            exit 0
          fi

          echo "正在请求 Netlify API 强制清空全球 CDN 边缘缓存..."
          HTTP_CODE=$(curl -s -o /tmp/netlify_purge.json -w "%{http_code}" -X POST \
            "https://api.netlify.com/api/v1/purge" \
            -H "Authorization: Bearer ${NETLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"site_id\":\"${NETLIFY_SITE_ID}\"}")

          echo "Netlify Purge HTTP 状态码: $HTTP_CODE"
          if [ -f /tmp/netlify_purge.json ]; then
            echo "Netlify 响应内容: $(cat /tmp/netlify_purge.json)"
          fi

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Netlify 全球边缘 CDN 缓存已成功清空！"
          else
            echo "⚠️ Netlify CDN 清除未返回 2xx (请检查 NETLIFY_SITE_ID 与 Token 是否有效)"
          fi

      - name: Force Purge Vercel CDN Cache
        if: ${{ env.ACTION_TYPE == 'cdn' || env.ACTION_TYPE == 'all' }}
        run: |
          VERCEL_TOKEN="${{ secrets.VERCEL_TOKEN || secrets.VERCEL_API_KEY || secrets.VERCEL_AUTH_TOKEN }}"
          VERCEL_PROJECT_ID="${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_NAME || 'honoki' }}"
          VERCEL_ORG_ID="${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}"
          VERCEL_HOOK="${{ secrets.VERCEL_DEPLOY_HOOK_URL || vars.VERCEL_DEPLOY_HOOK_URL }}"

          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "正在调用 Vercel 官方 Edge Cache REST API 清空生产环境边缘 CDN 缓存..."
            TEAM_QUERY=""
            if [ -n "$VERCEL_ORG_ID" ]; then
              TEAM_QUERY="&teamId=${VERCEL_ORG_ID}"
            fi
            HTTP_CODE=$(curl -s -o /tmp/vercel_purge.json -w "%{http_code}" -X POST \
              "https://api.vercel.com/v1/edge-cache/dangerously-delete-by-tags?projectIdOrName=${VERCEL_PROJECT_ID}${TEAM_QUERY}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"tags":["page","post","posts","home","archive","about","links","all-posts"],"target":"production"}')

            echo "Vercel Purge HTTP 状态码: $HTTP_CODE"
            if [ -f /tmp/vercel_purge.json ]; then
              echo "Vercel 响应内容: $(cat /tmp/vercel_purge.json)"
            fi

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ Vercel 官方 Edge Cache API 成功清除生产环境全球 CDN 页面缓存！"
            else
              echo "⚠️ Vercel Edge Cache API 返回非 2xx: $HTTP_CODE (请核对 VERCEL_TOKEN 与 VERCEL_PROJECT_ID)"
            fi
          elif [ -n "$VERCEL_HOOK" ]; then
            echo "正在触发 Vercel Deploy Hook..."
            HTTP_CODE=$(curl -s -o /tmp/vercel_purge.json -w "%{http_code}" -X POST "${VERCEL_HOOK}")
            echo "Vercel Deploy Hook HTTP 状态码: $HTTP_CODE"
            if [ -f /tmp/vercel_purge.json ]; then
              echo "Vercel 响应内容: $(cat /tmp/vercel_purge.json)"
            fi
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ Vercel 重新构建已成功触发，边缘 CDN 将在几秒内全量刷新！"
            else
              echo "⚠️ Vercel Deploy Hook 请求返回非 2xx 状态码: $HTTP_CODE"
            fi
          else
            echo "ℹ️ 未配置 VERCEL_TOKEN / VERCEL_PROJECT_ID 或 VERCEL_DEPLOY_HOOK_URL，跳过 Vercel CDN 清理。"
            exit 0
          fi

      # ----------------------------------------------------
      # 3. 预热全球边缘 CDN 节点 (HTTP GET)
      # ----------------------------------------------------
      - name: Warm up edge cache with GET requests
        if: ${{ env.ACTION_TYPE == 'all' || env.ACTION_TYPE == 'cdn' }}
        run: |
          BLOG_URL="${{ vars.BLOG_URL || secrets.BLOG_URL }}"
          if [ -z "$BLOG_URL" ]; then
            echo "ℹ️ 未配置 BLOG_URL，跳过边缘缓存预热。"
            exit 0
          fi

          TARGET_ORIGIN="${BLOG_URL%/}"
          if [[ ! "$TARGET_ORIGIN" =~ ^https?:// ]]; then
            TARGET_ORIGIN="https://${TARGET_ORIGIN}"
          fi

          echo "🚀 开始预热核心页面边缘 CDN (HTTP GET)..."
          
          # 核心页面列表
          PAGES=("/" "/archive" "/links" "/about" "/sitemap.xml")
          
          for path in "${PAGES[@]}"; do
            URL="${TARGET_ORIGIN}${path}"
            echo -n "预热 ${URL} ... "
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "$URL" || echo "failed")
            echo "状态码: $STATUS"
          done

          # 预热最新文章（从 manifest.json 读取前 3 篇）
          if [ -f posts/manifest.json ]; then
            node -e '
              const fs = require("fs");
              try {
                const manifest = JSON.parse(fs.readFileSync("posts/manifest.json", "utf-8"));
                const posts = (Array.isArray(manifest) ? manifest : (manifest.posts || [])).slice(0, 3);
                posts.forEach(p => {
                  if (p.slug) console.log(p.slug);
                });
              } catch {}
            ' | while read -r slug; do
              if [ -n "$slug" ]; then
                URL="${TARGET_ORIGIN}/posts/${slug}"
                echo -n "预热文章 ${URL} ... "
                STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "$URL" || echo "failed")
                echo "状态码: $STATUS"
              fi
            done
          fi

          echo "✅ 边缘缓存预热完成！"

